<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .term-bg { fill: #0d1117; rx: 12px; }
      .term-header { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; }
      .txt { font-family: 'Fira Code', monospace; font-size: 14px; line-height: 22px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0883e; font-weight: 500; }
      .white { fill: #c9d1d9; }
      .bold-white { fill: #f0f6fc; font-weight: 700; }
      .cyan { fill: #39c5bb; font-weight: 600; }
      .yellow { fill: #e3b341; font-weight: 600; }
      .green { fill: #56d364; font-weight: 600; }
      .dim { fill: #6e7681; }
      .red-badge { fill: #f85149; font-weight: 700; }
      .magenta { fill: #d2a8ff; font-weight: 600; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="560" class="term-bg" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>

  <!-- Terminal Header Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 38 L 0 38 Z" class="term-header"/>
  
  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="6" class="btn-red"/>
  <circle cx="38" cy="19" r="6" class="btn-yellow"/>
  <circle cx="56" cy="19" r="6" class="btn-green"/>

  <!-- Title -->
  <text x="425" y="24" text-anchor="middle" class="title">explain — Safety Meter &amp; Remote Execution Warning</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 75)" class="txt">
    <!-- Prompt Line 1 -->
    <text x="0" y="0">
      <tspan class="prompt">elsawy@dev</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="dim">$</tspan> <tspan class="cmd">explain "curl -fsSL https://get.docker.com | sh"</tspan>
    </text>

    <!-- Pipeline Flow -->
    <text x="15" y="32">
      <tspan class="magenta">Pipeline:</tspan> <tspan class="bold-white">curl</tspan> <tspan class="yellow"> ⟶ </tspan> <tspan class="bold-white">sh</tspan>
    </text>

    <!-- Stage 1 -->
    <text x="15" y="65">
      <tspan class="cyan">─── Stage 1 of 2 ───</tspan> <tspan class="dim">(curl)</tspan>
    </text>
    <text x="15" y="90">
      <tspan font-size="16">🌐</tspan> <tspan class="cyan">curl</tspan> <tspan class="dim">—</tspan> <tspan class="white">Transfers data to or from a server</tspan>
    </text>
    <text x="30" y="115">
      <tspan class="yellow">-f, --fail      </tspan> <tspan class="dim"> → </tspan> <tspan class="white">Fail silently on HTTP errors (4xx/5xx)</tspan>
    </text>
    <text x="30" y="138">
      <tspan class="yellow">-s, --silent    </tspan> <tspan class="dim"> → </tspan> <tspan class="white">Silent mode: do not show progress bar</tspan>
    </text>
    <text x="30" y="161">
      <tspan class="yellow">-L, --location  </tspan> <tspan class="dim"> → </tspan> <tspan class="white">Follow HTTP redirects (301, 302)</tspan>
    </text>

    <!-- Pipe connector -->
    <text x="30" y="195">
      <tspan class="yellow">│</tspan> <tspan class="dim">pipes stdout into next command</tspan>
    </text>

    <!-- Stage 2 -->
    <text x="15" y="230">
      <tspan class="cyan">─── Stage 2 of 2 ───</tspan> <tspan class="dim">(sh)</tspan>
    </text>
    <text x="15" y="255">
      <tspan font-size="16">💻</tspan> <tspan class="cyan">sh</tspan> <tspan class="dim">—</tspan> <tspan class="white">Shell command interpreter</tspan>
    </text>

    <!-- Danger Warning -->
    <text x="15" y="295">
      <tspan class="red-badge">🚨 REMOTE CODE EXECUTION</tspan> <tspan class="dim">·</tspan> <tspan class="bold-white">Risk / things to know</tspan>
    </text>
    <text x="30" y="320" class="white">
      Piping remote web scripts directly into a shell interpreter.
    </text>
    <text x="30" y="344">
      <tspan class="red-badge">Warning:</tspan> <tspan class="white">Executes unverified remote code immediately. Inspect first!</tspan>
    </text>
  </g>
</svg>
