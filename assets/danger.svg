<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 580" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .term-bg { fill: #0d1117; rx: 12px; }
      .term-header { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; }
      .txt { font-family: 'Fira Code', monospace; font-size: 14px; line-height: 22px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0883e; font-weight: 500; }
      .white { fill: #c9d1d9; }
      .bold-white { fill: #f0f6fc; font-weight: 700; }
      .bold-cyan { fill: #39c5bb; font-weight: 700; }
      .bold-magenta { fill: #bc8cff; font-weight: 700; }
      .bold-yellow { fill: #e3b341; font-weight: 700; }
      .bold-red { fill: #ff7b72; font-weight: 700; }
      .cyan { fill: #39c5bb; font-weight: 600; }
      .yellow { fill: #e3b341; font-weight: 600; }
      .green { fill: #56d364; font-weight: 600; }
      .dim { fill: #6e7681; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="580" class="term-bg" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>

  <!-- Terminal Header Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 38 L 0 38 Z" class="term-header"/>
  
  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="6" class="btn-red"/>
  <circle cx="38" cy="19" r="6" class="btn-yellow"/>
  <circle cx="56" cy="19" r="6" class="btn-green"/>

  <!-- Title -->
  <text x="425" y="24" text-anchor="middle" class="title">explain v1.1.0 — Pipeline &amp; Risk Assessment</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 75)" class="txt">
    <!-- Prompt Line 1 -->
    <text x="0" y="0">
      <tspan class="prompt">elsawy@dev</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="dim">$</tspan> <tspan class="cmd">explain "curl -fsSL https://get.docker.com | sh"</tspan>
    </text>

    <!-- Pipeline Overview -->
    <text x="15" y="32">
      <tspan class="bold-magenta">Pipeline Overview:</tspan> <tspan class="bold-white">curl</tspan> <tspan class="yellow">──►</tspan> <tspan class="bold-white">sh</tspan>
    </text>
    <text x="15" y="55">
      <tspan class="dim">└─►</tspan> <tspan class="white">Downloads a remote script from the web and pipes it directly to a shell interpreter.</tspan>
    </text>

    <!-- Stage 1 -->
    <text x="15" y="95">
      <tspan class="bold-cyan">┌── Stage 1 of 2 ──────────────────────────────────</tspan> <tspan class="dim">(curl)</tspan>
    </text>
    <text x="15" y="118">
      <tspan class="dim">│</tspan> <tspan class="bold-cyan">curl</tspan> <tspan class="dim">—</tspan> <tspan class="white">Transfers data to or from a server using HTTP/HTTPS protocols</tspan>
    </text>
    <text x="15" y="142">
      <tspan class="dim">│</tspan> <tspan class="green">What this command does</tspan>
    </text>
    <text x="15" y="164">
      <tspan class="dim">│</tspan>   <tspan class="green">└─►</tspan> <tspan class="white">Sends HTTP GET request to 'https://get.docker.com' and outputs response.</tspan>
    </text>

    <text x="15" y="194">
      <tspan class="bold-cyan">└───────────────────────────────────────────────</tspan>
    </text>
    <text x="50" y="216">
      <tspan class="bold-yellow">│</tspan> <tspan class="dim">pipes stdout into next command ──►</tspan>
    </text>

    <!-- Stage 2 -->
    <text x="15" y="248">
      <tspan class="bold-cyan">┌── Stage 2 of 2 ──────────────────────────────────</tspan> <tspan class="dim">(sh)</tspan>
    </text>
    <text x="15" y="271">
      <tspan class="dim">│</tspan> <tspan class="bold-cyan">sh</tspan> <tspan class="dim">—</tspan> <tspan class="white">Standard shell command interpreter</tspan>
    </text>
    <text x="15" y="295">
      <tspan class="dim">│</tspan> <tspan class="green">What this command does</tspan>
    </text>
    <text x="15" y="317">
      <tspan class="dim">│</tspan>   <tspan class="green">└─►</tspan> <tspan class="white">Executes 'sh' shell interpreter.</tspan>
    </text>
    
    <!-- Risk Assessment -->
    <text x="15" y="347">
      <tspan class="dim">│</tspan> <tspan class="bold-red">[ REMOTE CODE EXECUTION ]</tspan> <tspan class="dim">· Risk Assessment</tspan>
    </text>
    <text x="15" y="370">
      <tspan class="dim">│</tspan>   <tspan class="dim">└─►</tspan> <tspan class="white">Piping remote web scripts directly into a shell interpreter.</tspan>
    </text>
    <text x="15" y="392">
      <tspan class="dim">│</tspan>   <tspan class="bold-red">WARNING:</tspan> <tspan class="bold-white">Executes unverified remote code immediately.</tspan>
    </text>
    <text x="15" y="420">
      <tspan class="bold-cyan">└───────────────────────────────────────────────</tspan>
    </text>

    <!-- Smart Tip -->
    <text x="15" y="452">
      <tspan class="bold-yellow">Security Note:</tspan> <tspan class="white">Executing unverified remote scripts can be dangerous. Consider downloading first: curl -O &lt;url&gt;</tspan>
    </text>
  </g>
</svg>
