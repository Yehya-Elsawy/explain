<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .term-bg { fill: #0d1117; rx: 12px; }
      .term-header { fill: #161b22; }
      .btn-red { fill: #ff5f56; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #27c93f; }
      .title { fill: #8b949e; font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500; }
      .txt { font-family: 'Fira Code', monospace; font-size: 14px; line-height: 22px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0883e; font-weight: 500; }
      .white { fill: #c9d1d9; }
      .bold-white { fill: #f0f6fc; font-weight: 700; }
      .cyan { fill: #39c5bb; font-weight: 600; }
      .yellow { fill: #e3b341; font-weight: 600; }
      .green { fill: #56d364; font-weight: 600; }
      .dim { fill: #6e7681; }
      .red-badge { fill: #f85149; font-weight: 700; }
      .box { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6px; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="560" class="term-bg" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.5))"/>

  <!-- Terminal Header Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 38 L 0 38 Z" class="term-header"/>
  
  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="6" class="btn-red"/>
  <circle cx="38" cy="19" r="6" class="btn-yellow"/>
  <circle cx="56" cy="19" r="6" class="btn-green"/>

  <!-- Title -->
  <text x="425" y="24" text-anchor="middle" class="title">explain — user@linux:~</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 75)" class="txt">
    <!-- Prompt Line 1 -->
    <text x="0" y="0">
      <tspan class="prompt">elsawy@dev</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="dim">$</tspan> <tspan class="cmd">explain tar -xzf backup.tar.gz</tspan>
    </text>

    <!-- Output 1 -->
    <text x="15" y="32">
      <tspan font-size="16">📦</tspan> <tspan class="cyan">tar</tspan> <tspan class="dim">—</tspan> <tspan class="white">Creates, extracts, and lists archive files (.tar, .tar.gz)</tspan>
    </text>

    <text x="15" y="65" class="bold-white">Breakdown</text>
    
    <text x="30" y="92">
      <tspan class="yellow">-x, --extract</tspan> <tspan class="dim"> → </tspan> <tspan class="white">Extract files from an archive</tspan>
    </text>
    <text x="30" y="116">
      <tspan class="yellow">-z, --gzip   </tspan> <tspan class="dim"> → </tspan> <tspan class="white">Filter archive through gzip (.tar.gz / .tgz)</tspan>
    </text>
    <text x="30" y="140">
      <tspan class="yellow">-f, --file   </tspan> <tspan class="dim"> → </tspan> <tspan class="white">Specify archive filename </tspan><tspan class="cyan">(Target: backup.tar.gz)</tspan>
    </text>

    <text x="15" y="176" class="green">What this command does</text>
    <text x="30" y="200" class="white">
      Extracts files from gzip-compressed archive (.tar.gz) <tspan class="cyan">'backup.tar.gz'</tspan> into current directory.
    </text>

    <text x="15" y="235">
      <tspan class="yellow">🟡 MODERATE</tspan> <tspan class="dim">·</tspan> <tspan class="bold-white">Risk / things to know</tspan>
    </text>
    <text x="30" y="258" class="dim">
      Modifies files in current directory if filenames already exist.
    </text>

    <!-- Prompt Line 2 (cd command) -->
    <text x="0" y="310">
      <tspan class="prompt">elsawy@dev</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="dim">$</tspan> <tspan class="cmd">explain cd /home/</tspan>
    </text>

    <text x="15" y="342">
      <tspan font-size="16">💻</tspan> <tspan class="cyan">cd</tspan> <tspan class="dim">—</tspan> <tspan class="white">Changes the current working directory in the shell</tspan>
    </text>

    <text x="15" y="375" class="bold-white">Breakdown</text>
    <text x="30" y="402">
      <tspan class="cyan">/home/       </tspan> <tspan class="dim"> → </tspan> <tspan class="white">Target destination directory to switch to</tspan>
    </text>

    <text x="15" y="438" class="green">What this command does</text>
    <text x="30" y="462" class="white">
      Changes the current working directory to <tspan class="cyan">'/home/'</tspan>.
    </text>
  </g>
</svg>
