version: 2

project_name: explain

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    goarm:
      - 7
    main: ./cmd/explain
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE

nfpms:
  - maintainer: explain contributors
    description: Linux command explainer for beginners
    homepage: https://github.com/Yehya-Elsawy/explain-
    license: MIT
    formats:
      - deb
      - rpm
      - apk

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
